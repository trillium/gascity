# mcp-agent-mail Deployment — inter-agent messaging server.
#
# Runs mcp_agent_mail as a single-replica HTTP service. Agents reach it
# at http://mcp-mail.gc.svc.cluster.local:8765 via the companion Service.
#
# Uses a Deployment pinned to the server node with a PVC for mail durability
# across pod restarts. mcp-agent-mail uses SQLite so multiple replicas won't
# help — scale the single replica instead.
#
# Build the image first:
#   docker build -f contrib/k8s/Dockerfile.mail -t gc-mcp-mail:latest .

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-mail
  namespace: gc
  labels:
    app: mcp-mail
    app.kubernetes.io/part-of: gas-city
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-mail
  template:
    metadata:
      labels:
        app: mcp-mail
    spec:
      # Pin mcp-mail to the server node alongside its PVC (local-path storage).
      # Label the server node: kubectl label node <name> gc/role=server
      nodeSelector:
        gc/role: server
      containers:
      - name: mcp-mail
        image: gc-mcp-mail:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8765
          name: http
        volumeMounts:
        - name: mail-data
          mountPath: /var/lib/mcp-mail
        livenessProbe:
          httpGet:
            path: /health/liveness
            port: 8765
          initialDelaySeconds: 5
          periodSeconds: 15
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/liveness
            port: 8765
          initialDelaySeconds: 3
          periodSeconds: 5
          failureThreshold: 3
        # Sized for 100-agent deployments. mcp-agent-mail uses SQLite
        # (single-writer lock), so multiple replicas won't help — scale
        # the single replica instead.
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
      volumes:
      - name: mail-data
        persistentVolumeClaim:
          claimName: mcp-mail-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mcp-mail-data
  namespace: gc
  labels:
    app: mcp-mail
    app.kubernetes.io/part-of: gas-city
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
